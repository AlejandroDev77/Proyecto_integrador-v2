services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    security_opt: ["no-new-privileges:true"]
  db-init:
    image: postgres:17.6-alpine
    restart: "no"
    env_file: [runtime-secrets.env]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./docker/postgres/create-app-user.sh:/create-app-user.sh:ro]
    entrypoint: ["/bin/sh", "/create-app-user.sh"]
    depends_on:
      db:
        condition: service_healthy
  storage-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "mkdir -p /app/storage/images /app/storage/models && chown -R 10001:10001 /app/storage"]
    volumes: [backend_storage:/app/storage]
  backend:
    build: {context: ./backend}
    restart: unless-stopped
    env_file: [runtime-secrets.env]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
    expose: ["8080"]
    volumes: [backend_storage:/app/storage]
    depends_on:
      db-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.5
  frontend:
    build: {context: ./frontend}
    restart: unless-stopped
    ports: ["80:8080"]
    depends_on: [backend]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
volumes:
  postgres_data:
  backend_storage:
