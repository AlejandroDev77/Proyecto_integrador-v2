spring.application.name=Bosquejo-Backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/BD_BOSQUEJO}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bosquejo_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.port=8080
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.jackson.property-naming-strategy=SNAKE_CASE
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
oauth2.google.client-id=${GOOGLE_CLIENT_ID}
app.frontend-url=${APP_FRONTEND_URL:http://localhost}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}
server.tomcat.relaxed-query-chars=|,{,},[,]
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:200}
server.tomcat.max-swallow-size=30MB
server.tomcat.max-parameter-count=1000
spring.mvc.hiddenmethod.filter.enabled=true
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.ai-service.url=${AI_SERVICE_URL:http://ai-service:8000}
app.chat.webhook-url=${CHAT_WEBHOOK_URL}
app.storage.location=${STORAGE_LOCATION:storage}
app.base-url=${APP_BASE_URL:http://localhost}
app.r2.access-key-id=${R2_ACCESS_KEY_ID}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
app.r2.endpoint=${R2_ENDPOINT}
app.r2.bucket=${R2_BUCKET}
app.r2.public-url=${R2_PUBLIC_URL}
app.tripo3d.api-key=${TRIPO3D_API_KEY}
app.tripo3d.base-url=${TRIPO3D_BASE_URL:https://openapi.tripo3d.ai/v3}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
